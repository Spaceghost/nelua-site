name: Daily Nelua community refresh

on:
  schedule:
    - cron: '17 7 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions: {}

concurrency:
  group: nelua-community-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'Spaceghost/nelua-site' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Spaceghost' && github.triggering_actor == 'Spaceghost'
    runs-on: [self-hosted, Linux, X64, nelua-site, fedora-std]
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: '4535c96bfc7d1d8864f2d207e97f3ff5'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Provide GitHub CLI on the runner
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then exit 0; fi
          tool_dir="$(mktemp -d "$RUNNER_TEMP/nelua-gh.XXXXXX")"
          cd "$tool_dir"
          archive=gh_2.105.0_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/cli/cli/releases/download/v2.105.0/$archive"
          echo "79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f  $archive" | sha256sum --check --status
          tar -xzf "$archive" --strip-components=1 gh_2.105.0_linux_amd64/bin/gh
          echo "$tool_dir/bin" >> "$GITHUB_PATH"
      - name: Check private counting and consent boundaries
        shell: bash
        run: |
          node --test community-api/tests/security.test.mjs
          python3 scripts/test-community-private.py
      - name: Refresh, validate and publish public source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          export TMPDIR="$RUNNER_TEMP/nelua-community/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          export npm_config_cache="$RUNNER_TEMP/nelua-community/npm"
          export NODE_COMPILE_CACHE="$RUNNER_TEMP/nelua-community/node-compile"
          mkdir -p "$TMPDIR" "$npm_config_cache" "$NODE_COMPILE_CACHE"
          python3 scripts/community-daily.py \
            --workspace "$RUNNER_TEMP/nelua-community/workspace" \
            --cache-dir "$RUNNER_TEMP/nelua-community/cache" \
            --artifact-dir "$RUNNER_TEMP/nelua-community/artifacts"
      - name: Refresh consented private totals
        shell: bash
        run: python3 scripts/community-private.py
      - name: Retain the public collection report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: community-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/nelua-community/artifacts/**/report.json
            ${{ runner.temp }}/nelua-community/artifacts/**/run.log
            ${{ runner.temp }}/nelua-community/artifacts/**/snapshot/data.json
            ${{ runner.temp }}/nelua-community/artifacts/last-success.json
